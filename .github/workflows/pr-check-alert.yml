name: PR Check Failure Alert

on:
  check_run:
    types:
      - completed

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write

jobs:
  alert-on-failure:
    if: >-
      github.event.check_run.status == 'completed' &&
      contains(fromJSON('["failure","timed_out","cancelled","action_required","startup_failure"]'), github.event.check_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Post or update PR alert comment
        uses: actions/github-script@v7
        with:
          script: |
            const checkRun = context.payload.check_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch =
              checkRun.check_suite?.head_branch ||
              checkRun.head_branch ||
              checkRun.pull_requests?.[0]?.head?.ref ||
              'unknown';
            const statusDate = checkRun.completed_at || checkRun.started_at || new Date().toISOString();
            const recommendedNextAction =
              `Review the logs for \`${checkRun.name}\`, fix the branch \`${branch}\`, and rerun the checks.`;
            const openPullRequests = (checkRun.pull_requests || []).filter((pr) => pr.state === 'open');

            if (!openPullRequests.length) {
              core.info('No open pull requests are associated with this check run.');
              return;
            }

            const marker = `<!-- ci-alert:${Buffer.from(checkRun.name).toString('base64')} -->`;

            for (const pr of openPullRequests) {
              const body = `${marker}
### CI Alert
- PR title: ${pr.title}
- PR number: #${pr.number}
- Repo: ${owner}/${repo}
- Branch: \`${branch}\`
- Failing check name: \`${checkRun.name}\`
- Status/date: \`${checkRun.conclusion}\` at ${statusDate}
- Recommended next action: ${recommendedNextAction}`;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pr.number,
                per_page: 100,
              });

              const existingComment = comments.find(
                (comment) =>
                  comment.user?.login === 'github-actions[bot]' &&
                  typeof comment.body === 'string' &&
                  comment.body.includes(marker)
              );

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
